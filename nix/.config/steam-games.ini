[DEFAULT]
;? gpu: auto (prefer NVIDIA, prompt when disabled), nvidia or integrated
gpu = auto
;? enable gamemoded via LD_PRELOAD
gamemode = true
;? binary wrapper before game execution (e.g. gamescope or env VAR=val)
wrapper =

;? example per-game config by Steam AppID:
; [1091500] ; Cyberpunk 2077
; gpu = nvidia
; gamemode = true

;? example running lightweight game on iGPU with gamescope:
; [1794680] ; Vampire Survivors
; gpu = integrated
; wrapper = gamescope -w 1920 -h 1080 -W 2560 -H 1440 -U -f --

;? example config by executable name (for non-Steam games):
; [eldenring.exe]
; gpu = nvidia
